# Accounts and login (SPEC F7.2). Restart the app after editing. No secrets here.

# How much work turning a password into its stored "hash" takes. Higher numbers make a
# stolen database slower to crack, but each login takes longer and uses more memory
# (about 128 x n x r bytes: 32 MB with these numbers). Each stored password remembers
# the numbers it was made with, so changing them only affects passwords set afterwards.
scrypt:
  n: 32768   # must be a power of two
  r: 8
  p: 1

# How many days you stay logged in on a device before being asked for your password
# again (1 to 365).
session_days: 30

# Shortest password allowed (8 to 128 characters).
min_password_length: 12

# Ask for a login before showing any page (true/false). Leave false on your own computer;
# switch to true when the app runs online.
login_required: false

# Wrong passwords: after max_failed_logins wrong tries for one email within
# failed_login_window_minutes, password logins for that email are refused for
# lockout_minutes ("Sign in with Google" still works).
max_failed_logins: 10
failed_login_window_minutes: 15
lockout_minutes: 15

# Reports each user other than you may generate per day (US Eastern days). You have no
# limit. Keeps the AI credit for you.
reports_per_day: 2

# Who may create an account (sign-up page or "Sign in with Google"), one email per line:
#   invited:
#     - friend@example.com
# Don't invite anyone yet: the market data the app uses (Yahoo Finance) is for personal use
# only, so sharing it with others needs a different data source first (docs/SPEC.md, Open
# questions). You (the owner) don't need to be on the list.
invited: []
