# What each stock's valuation is compared with (SPEC F4.7). Restart the app after editing.
#
# Automatic, no lists needed: every stock gets Yahoo's sector and industry, and is compared
# with (1) its own past fiscal years, (2) its industry's largest companies ("peers"),
# (3) its sector's largest companies, and (4) Professor Damodaran's industry average.
# Each comparison uses the median (the middle value), so one extreme company can't skew it.

# How many of the industry's largest companies are used as peers (the stock itself is left out).
industry_peers: 10
# How many of the sector's largest companies make up the sector benchmark.
sector_companies: 25
# Peer figures and the companies in each group are reused for this many hours.
refresh_hours: 24

# Changes for individual tickers. Leave a ticker out when the automatic choice is fine.
#   sector:              one of Yahoo's 11 sectors: Basic Materials, Communication Services,
#                        Consumer Cyclical, Consumer Defensive, Energy, Financial Services,
#                        Healthcare, Industrials, Real Estate, Technology, Utilities
#   industry:            a Yahoo industry name, e.g. "Software - Infrastructure"
#   peers:               your own peer list, used instead of the industry's largest companies
#   damodaran_industry:  a Damodaran industry name (see the list below)
tickers:
  AMZN:
    sector: Technology  # Yahoo files Amazon under Consumer Cyclical (owner 2026-11-04)
  # Example:
  # TSLA:
  #   peers: [GM, F, RIVN, TM]

# Damodaran's US industry averages (NYU Stern, updated every January; free).
damodaran:
  enabled: true
  # Yahoo industry -> Damodaran industry. Damodaran uses about 95 broader industries,
  # so several Yahoo industries share one. If the report says a name isn't found, Damodaran
  # has renamed an industry: copy the new name from his page into the right-hand side.
