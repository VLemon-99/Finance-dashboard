# App limits and timings. Edit the numbers, then restart the app to apply them.
# (No secrets here. API keys go in .env.)

watchlists:
  # Most watchlists you can have (SPEC F1.3).
  max_watchlists: 30
  # Most stocks in one watchlist (SPEC F1.3).
  max_items_per_list: 25

market_data:
  # Stored prices younger than this are shown without asking Yahoo again.
  # The Refresh button always fetches new prices (SPEC F1.5).
  refresh_minutes: 15
  # How many stocks to fetch from Yahoo at the same time when refreshing a list.
  # Higher is faster but more likely to get rate-limited. 1 to 10.
  max_parallel_fetches: 4
  # Days the US stock market was closed besides weekends and its regular holidays (New
  # Year's, MLK Day, Presidents' Day, Good Friday, Memorial Day, Juneteenth, July 4,
  # Labor Day, Thanksgiving, Christmas: those are worked out automatically). Trades can't
  # be dated on a closed day. Add a date here if the market closes unexpectedly.
  extra_closed_days:
    - 2001-09-11  # September 11 attacks (closed Sep 11-14)
    - 2001-09-12
    - 2001-09-13
    - 2001-09-14
    - 2004-06-11  # President Reagan's funeral
    - 2007-01-02  # President Ford's funeral
    - 2012-10-29  # Hurricane Sandy
    - 2012-10-30
    - 2018-12-05  # President George H.W. Bush's funeral
    - 2025-01-09  # President Carter's funeral

options:
  # The greeks need a risk-free interest rate. We use the 13-week US T-bill yield from
  # Yahoo; if it can't be fetched, this rate (percent per year) is used and the page says so.
  fallback_risk_free_rate_percent: 4.0
  # Yahoo shows a tiny placeholder IV (like 0.001%) for strikes that barely trade.
  # IVs below this (percent) are shown as "—" and no greeks are calculated for them.
  min_implied_volatility_percent: 1.0
  # The Option chains page shows your watchlist and portfolio stocks as one-tap shortcuts,
  # A to Z; at most this many (0 hides them).
  max_quick_tickers: 20
  # Option prices follow market_data.refresh_minutes above, like stocks.

search:
  # Most results to show for a ticker/company search (SPEC F1.1). 1 to 25.
  max_results: 10

reports:
  # Every report covers this many days back from when it's made (SPEC F4.14). Items
  # already summarized in an earlier report are reused, not sent to the AI again.
  max_days: 7
  # Headlines at least this similar (0 to 1, where 1 = identical) are treated as the same
  # story and shown once with all their sources (SPEC F4.12)...
  duplicate_headline_similarity: 0.85
  # ...when they were published within this many hours of each other.
  duplicate_window_hours: 72
  # How much each kind of source counts toward a ticker's sentiment score (SPEC F4.6).
  sentiment_weights:
    filing: 1.0
    news: 1.0
    blog: 0.8
    youtube: 0.7
    x: 0.5
    reddit: 0.3
  # Insider trades: a report shows this many (the largest by dollar value); the full list is
  # one click away. 0 shows only the totals.
  insider_highlights: 3

ai:
  # Gemini model. "gemini-flash-latest" always points at Google's current Flash model.
  model: gemini-flash-latest
  # Seconds to wait for one AI answer.
  timeout_seconds: 120
  # How many items the AI summarizes in one request, and the most text per request
  # (characters). Fewer, bigger requests cost about the same but are faster.
  max_items_per_call: 20
  max_chars_per_call: 400000
  # Most statements in the "Major developments" and "Rumors & speculation" sections.
  max_developments: 6
  max_rumors: 4
  # The "Bottom line" on top of each report (sentences), and the most points in each of the
  # "Bull case" and "Bear case".
  max_bottom_line: 3
  max_case_points: 3
  # YouTube videos (SPEC F4.5). The AI watches each new video once and keeps its summary,
  # so a video is never watched twice (not even for another ticker).
  # The most new videos watched in one run; the rest wait for the next run.
  max_videos_per_run: 10
  # How much of each video is watched, in minutes from the start. Longer videos cost more
  # AI credit (roughly a few cents per 20 minutes on a Flash model).
  max_video_minutes: 60
  # How many videos are watched at the same time (faster runs).
  parallel_videos: 3

schedule:
  # Automatic reports for every watchlist on weekdays (SPEC F4.9). Off for now: reports are
  # started with "Generate now". To switch them on, change false to true and restart the app.
  enabled: false
  # Time of day, US Eastern, 24-hour clock. Keep the quotes.
  time: "07:30"

calendar:
  # The list view shows this many days from today (SPEC F5.3).
  list_days: 14
  # Earnings and economic release dates are checked again after this many hours, or this
  # many minutes after the source failed.
  refresh_hours: 24
  retry_minutes: 15
  # How far ahead earnings dates are fetched (days).
  earnings_days_ahead: 90
  # Impact tags (SPEC F5.2): high or medium. "High impact only" and the home page use them.
  earnings_impact: high
  fomc_decision_impact: high
  fomc_minutes_impact: medium
  # How many upcoming high-impact events the home page shows (SPEC F5.6).
  home_events: 3
  # Economic releases whose dates come from FRED's release calendar. Times are US Eastern
  # (keep the quotes). fred_release_id is the number in the address of the release's page
  # on fred.stlouisfed.org (e.g. .../release?rid=10).
  macro_releases:
    - name: CPI (consumer prices)
      fred_release_id: 10
      time: "08:30"
      impact: high
    - name: Jobs report (employment situation)
      fred_release_id: 50
      time: "08:30"
      impact: high
    - name: PCE (personal income and outlays)
      fred_release_id: 54
      time: "08:30"
      impact: medium
    - name: GDP
      fred_release_id: 53
      time: "08:30"
      impact: medium
