{% extends "base.html" %}
{% block title %}Quote lookup · Finance Dashboard{% endblock %}
{% block content %}
<h1>Quote lookup</h1>
<form action="/lookup" method="get" hx-get="/lookup/result" hx-target="#result" hx-indicator="#loading" class="quote-form">
  <label for="ticker">Ticker</label>
  <input id="ticker" name="ticker" value="{{ ticker }}" placeholder="e.g. AAPL" maxlength="12"
         autocomplete="off" autocapitalize="characters" required autofocus>
  <button type="submit">Get quote</button>
  <span id="loading" class="htmx-indicator">Fetching…</span>
</form>
<div id="result">{% include "_quote_result.html" %}</div>
{% endblock %}
