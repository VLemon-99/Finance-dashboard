{% extends "base.html" %}
{% block title %}Log in · Finance Dashboard{% endblock %}
{% block content %}
<h1>Log in</h1>
{% if message %}<p class="note error" role="alert">{{ message }}</p>{% endif %}
<form action="/login" method="post" class="trade-form login-form">
  <input type="hidden" name="next" value="{{ next }}">
  <div class="field">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email }}" maxlength="320"
           autocomplete="username" autocapitalize="none" required {% if not email %}autofocus{% endif %}>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" maxlength="1024"
           autocomplete="current-password" required {% if email %}autofocus{% endif %}>
  </div>
  <button type="submit">Log in</button>
</form>
<p class="muted">Invited? <a href="/signup{% if next != '/' %}?next={{ next | urlencode }}{% endif %}">Create your account</a>.</p>
{% endblock %}
