[project]
name = "finance-dashboard"
version = "0.1.0"
description = "Personal research dashboard for stocks and options (no brokerage link, never trades)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.48",
    "tzdata>=2026.6 ; sys_platform == 'win32'",
    "uvicorn[standard]>=0.54.0",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# Migration files are generated by Alembic; don't lint them.
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Starlette suggests a newer test HTTP client; httpx works fine for now.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
